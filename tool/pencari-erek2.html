  const bersih = input.trim();
  if (!bersih) {
    return { valid: false, pesan: "Silakan masukkan angka atau kata pencarian." };
  }

  const hanyaAngka = /^[0-9]+$/.test(bersih);
  const hanyaHuruf = /^[a-zA-Z\s]+$/.test(bersih);
  const campur     = /[0-9]/.test(bersih) && /[a-zA-Z]/.test(bersih);

  // ❌ Campur angka & huruf
  if (campur) {
    return { valid: false, pesan: "Input tidak boleh mencampur angka dan kata. Masukkan angka saja (2 digit) atau kata saja." };
  }

  // ❌ Input angka tapi bukan 2 digit
  if (hanyaAngka && bersih.length !== 2) {
    return { valid: false, pesan: "Angka harus tepat 2 digit (contoh: 00, 01, 99)." };
  }

  // ✅ Angka 2 digit → langsung cari
  if (hanyaAngka && bersih.length === 2) {
    return { valid: true, keywords: [bersih] };
  }

  // ✅ Kata (bisa 1 atau lebih) → pecah jadi array
  if (hanyaHuruf) {
    const keywords = bersih.toLowerCase().split(/\s+/).filter(k => k.length > 0);
    return { valid: true, keywords: keywords };
  }

  return { valid: false, pesan: "Format input tidak dikenali." };
}

/* =========================================================
   FUNGSI PENCARIAN
   ========================================================= */
function cariData() {
  const input = document.getElementById("searchInput").value;
  const hasilDiv = document.getElementById("hasil");
  hasilDiv.innerHTML = "";

  // Validasi input
  const cek = validasiInput(input);
  if (!cek.valid) {
    alert("⚠️ " + cek.pesan);
    return;
  }

  const keywords = cek.keywords;

  // Filter: cocokkan jika SALAH SATU keyword ada di nama file (OR)
  const hasil = daftarUrl.filter(url => {
    const namaFile = url.split("/").pop().toLowerCase();
    return keywords.some(k => namaFile.includes(k));
  });

  if (hasil.length === 0) {
    hasilDiv.innerHTML = '<div class="no-result">❌ Tidak ada hasil untuk: <b>' + input + '</b></div>';
    return;
  }

  // Tampilkan hasil
  hasil.forEach(url => {
    const namaFile = decodeURIComponent(url.split("/").pop().replace(".png", ""));
    const div = document.createElement("div");
    div.className = "result-item";
    div.innerHTML = `
      <img width="96%" src="${url}" alt="${namaFile}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/200x200?text=Tidak+Ditemukan'">
      <div class="label">${namaFile}</div>
    `;
    hasilDiv.appendChild(div);
  });
}

/* Enter untuk mencari */
document.getElementById("searchInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") cariData();
});
