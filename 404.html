<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            animation: fadeIn 1s ease-in;
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(45deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            line-height: 1;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 32px;
            margin: 20px 0 10px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        p {
            font-size: 18px;
            color: #b0b0d0;
            margin: 15px 0 30px;
            line-height: 1.8;
        }

        .emoji-big {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .fun-fact {
            margin-top: 30px;
            font-size: 14px;
            color: #6a6a9a;
            border-top: 1px solid #2a2a5a;
            padding-top: 20px;
        }

        .fun-fact span {
            color: #f5576c;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .error-code { font-size: 80px; }
            h1 { font-size: 24px; }
            p { font-size: 16px; }
            .btn { padding: 12px 30px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji-big">🔍</span>
        <div class="error-code">404</div>
        <h1>Halaman Tidak Ditemukan</h1>
        <p>
            Ups! Sepertinya halaman yang kamu cari sudah pindah,<br>
            dihapus, atau tidak pernah ada sama sekali.
        </p>
        <a href="/" class="btn">🏠 Kembali ke Beranda</a>
        <div class="fun-fact">
            💡 <span>Fun Fact:</span> 404 adalah kode HTTP yang paling sering ditemui,<br>
            tapi jangan sedih—kamu bukan satu-satunya yang tersesat di sini!
        </div>
    </div>
</body>
</html>
